name: Daily follow-ups

# 07:00 Panama (12:00 UTC), Monday to Friday.
# --via auto walks the channels in order — WhatsApp, Gmail, then plain SMTP —
# and stops at the first one that is configured. So it sends Gmail today and
# WhatsApp by itself the day the Meta template is approved, with no edit here.
# (iMessage cannot run on GitHub — only a Mac can send it.)
on:
  schedule:
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      always:
        description: 'Send even if nothing is late'
        type: boolean
        default: false
      via:
        description: 'auto, all, or a list like gmail,email'
        type: string
        default: auto

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send the follow-up list
        env:
          SMTP_HOST:    ${{ secrets.SMTP_HOST }}
          SMTP_PORT:    ${{ secrets.SMTP_PORT }}
          SMTP_USER:    ${{ secrets.SMTP_USER }}
          SMTP_PASS:    ${{ secrets.SMTP_PASS }}
          MAIL_TO:      ${{ secrets.MAIL_TO }}
          WA_TOKEN:     ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID:  ${{ secrets.WA_PHONE_ID }}
          WA_TO:        ${{ secrets.WA_TO }}
          WA_TEMPLATE:  ${{ secrets.WA_TEMPLATE }}
          GMAIL_CLIENT_ID:     ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER:        ${{ secrets.GMAIL_SENDER }}
        run: >
          python3 tools/followups.py due --send
          --via ${{ inputs.via || 'auto' }}
          ${{ inputs.always && '--always' || '' }}
